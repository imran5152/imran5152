name: Contribution snake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#55edff&color_dots=#0b1020,#203354,#315d7d,#4b8fa2,#9b8bff
        env:
          GITHUB_TOKEN: [redacted] secrets.GITHUB_TOKEN }}

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: [redacted] secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
